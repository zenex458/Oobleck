name: tags

on:
  push:
     branches:
      - main
      - feat/release-action

permissions:
  contents: write

jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Create tag
        run: |
          curdate=$(date "+%Y%d%m%s")
          git tag "$curdate"
          git push origin "$curdate"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

